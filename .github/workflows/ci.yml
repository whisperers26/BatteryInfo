name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build BatteryInfo.slnx -c Release

      - name: Test
        run: dotnet test BatteryInfo.slnx -c Release --no-build --logger "console;verbosity=normal"
